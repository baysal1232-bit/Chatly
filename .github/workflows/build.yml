name: Build Chatly APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Chatly ZIP
        run: |
          rm -rf extracted_project
          mkdir extracted_project
          unzip -o chatly.zip -d extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        working-directory: extracted_project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: find extracted_project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chatly-debug-APK
          path: extracted_project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
