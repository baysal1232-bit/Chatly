name: Build Chatly APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Chatly ZIP
        run: |
          echo "=== ZIP DOSYALARI ==="
          ls -lh *.zip

          rm -rf extracted_project
          mkdir extracted_project

          unzip -o chatly_fixed.zip -d extracted_project

          echo "=== ÇIKARILAN PROJE ==="
          ls -la extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check Android project
        working-directory: extracted_project
        run: |
          echo "=== PROJECT ==="
          ls -la

          echo "=== APP ==="
          ls -la app

          echo "=== SETTINGS ==="
          cat settings.gradle.kts

      - name: Build Debug APK
        working-directory: extracted_project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "=== APK DOSYALARI ==="
          find extracted_project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chatly-debug-APK
          path: extracted_project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
