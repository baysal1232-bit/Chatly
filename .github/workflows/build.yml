name: Build Android APK from Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Chatly ZIP
        run: |
          rm -rf extracted_project
          mkdir extracted_project
          unzip -o chatly.zip -d extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check project
        run: |
          cd extracted_project
          echo "Project files:"
          ls -la
          echo "Gradle version:"
          gradle --version

      - name: Build Debug APK
        run: |
          cd extracted_project
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "APK files:"
          find extracted_project -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chatly-debug-APK
          path: extracted_project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
